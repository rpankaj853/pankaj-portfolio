<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <circle cx="40" cy="40" r="36" fill="url(#bg)" stroke="url(#ring)" stroke-width="1.5"/>
  <!-- Nodes -->
  <circle cx="30" cy="30" r="4" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="50" cy="30" r="4" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="40" cy="48" r="4" fill="url(#node)" filter="url(#glow)"/>
  <!-- Connection lines -->
  <line x1="30" y1="30" x2="50" y2="30" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="30" x2="40" y2="48" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="30" x2="40" y2="48" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0d1a"/></radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0.3"/></linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#7c3aed"/></radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>
